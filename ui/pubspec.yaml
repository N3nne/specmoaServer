name: specmoa_zip_ui
description: Flutter implementation scaffold based on the Stitch specmoa.zip UI design.
publish_to: "none"
version: 0.2.1+5

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.2.2
  shared_preferences: ^2.3.3
  flutter_secure_storage: ^10.0.0
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: SpecInter
      fonts:
        - asset: assets/fonts/Inter.ttf
    - family: SpecJakarta
      fonts:
        - asset: assets/fonts/PlusJakartaSans.ttf
  assets:
    - assets/branding/specmoa_logo.png
    - assets/branding/specmoa_icon.png
